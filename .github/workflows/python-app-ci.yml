# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: GitHub Actions for KERIA
on:
  push:
    branches:
      - "main"
      - "development"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12.15
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.15
      - name: Config libsodium
        if: runner.os == 'macOS'
        run: |
          echo "SODIUM_INSTALL=system" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=/opt/homebrew/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
      - name: Install dependencies
        run: make install-dev
      - name: Lint changes
        run: make lint
      - name: Check formatting
        run: make format-check
      - name: Run core KERIA tests
        run: make test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run docker container
        # Ensure that the image can be built and started
        run: docker compose up --build --wait

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12.15
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.15
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
      - name: Install dependencies
        run: make install-dev
      - name: Run core KERIA tests
        run: make test-coverage
      - name: Upload
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  fresh-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12.15
      - name: Install without the lockfile
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install "setuptools>=84.1.0" "wheel>=0.46.2"
          python -m pip install -e . pytest requests
          python -m pip check
          python - <<'PYTHON'
          from importlib import metadata

          for name, version in {"gleif_keria": "0.4.6", "gleif_keri": "1.2.18", "gleif_hio": "0.6.22"}.items():
              assert metadata.version(name) == version
          for package, provider in {"keria": "gleif-keria", "keri": "gleif-keri", "hio": "gleif-hio"}.items():
              assert {name.replace("_", "-") for name in metadata.packages_distributions()[package]} == {provider}
          PYTHON
      - name: Test freshly resolved dependencies
        run: python -m pytest tests/
